                    setStep('result');

                return `${m}:${sec < 10 ? '0' : ''}${sec}`;

                const currentQ = activeQuestions.slice(start, start + limit);
                const totalPages = Math.ceil(activeQuestions.length / limit);
                const isLastPage = start + limit >= activeQuestions.length;

                return (
                    <div className="max-w-3xl mx-auto p-4 pb-48">

                        <div className="fixed top-0 left-0 right-0 bg-white shadow-md z-50 border-b-4 border-blue-300 px-4 py-2 flex justify-between items-center h-16 safe-top">
                            <div><div className="text-[10px] font-bold text-blue-800">SISWA</div><div className="font-bold text-blue-700 truncate max-w-[150px]">{nama}</div></div>

                        <div className="mt-20 space-y-6">
